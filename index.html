<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Assistant:wght@400;500;600;700&display=swap");
:root{
  --red:#C21C17; --maroon:#971D05;
  --bg:#F7F5F3; --surface:#FFFFFF; --surface-2:#F1EDEA;
  --text:#1A1513; --muted:#6B5F59; --border:#E2DAD5;
  --open:#1B7A3D; --open-bg:#E6F4EA;
  --shut:#7A6E68; --shut-bg:#EFEBE8;
  --soon:#8A5A00; --soon-bg:#FBF0DC;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15110F; --surface:#201A17; --surface-2:#2A2320;
    --text:#F4EFEC; --muted:#B3A69F; --border:#39302C;
    --open:#6EDB97; --open-bg:#143022;
    --shut:#A4978F; --shut-bg:#282120;
    --soon:#F0C274; --soon-bg:#2E2314;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15110F; --surface:#201A17; --surface-2:#2A2320;
  --text:#F4EFEC; --muted:#B3A69F; --border:#39302C;
  --open:#6EDB97; --open-bg:#143022;
  --shut:#A4978F; --shut-bg:#282120;
  --soon:#F0C274; --soon-bg:#2E2314;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Poppins",system-ui,sans-serif;letter-spacing:-0.01em}
a{color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{background:linear-gradient(158deg,var(--red) 0%,var(--maroon) 100%);color:#fff;padding:18px 0 20px}
.mh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kicker{font-family:"Poppins";font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.82;margin:0 0 4px;line-height:1.35}
.masthead h1{font-size:23px;font-weight:700;margin:0;line-height:1.2}
.masthead .sub{font-size:14px;opacity:.88;margin:4px 0 0}
.langtoggle{display:flex;background:rgba(255,255,255,.17);border-radius:999px;padding:3px;flex:0 0 auto}
.langtoggle button{appearance:none;border:0;background:transparent;color:#fff;font-family:"Poppins";font-weight:600;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;min-width:38px}
.langtoggle button[aria-pressed="true"]{background:#fff;color:var(--maroon)}
.countdown{display:flex;gap:8px;margin-top:16px}
.cd-unit{flex:1;background:rgba(0,0,0,.19);border-radius:10px;padding:8px 4px;text-align:center}
.cd-num{font-family:"Poppins";font-weight:700;font-size:21px;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.cd-lab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.82}
.cd-note{font-size:12.5px;opacity:.88;margin:9px 0 0;text-align:center}

/* ---------- sections ---------- */
section{margin-top:26px}
.sec-h{font-size:17px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:"";width:3px;height:17px;background:var(--red);border-radius:2px;flex:0 0 auto}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:7px;bottom:7px;width:2px;background:var(--border)}
.tl li{position:relative;padding:0 0 15px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--border);box-sizing:border-box}
.tl li.past::before{background:var(--border)}
.tl li.now::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 22%,transparent)}
.tl li.next::before{background:var(--surface);border-color:var(--red)}
.tl .d{font-family:"Poppins";font-weight:600;font-size:12.5px;color:var(--muted);display:block}
.tl li.now .d{color:var(--red)}
.tl .t{font-size:14.5px;display:block}
.tl li.past .d,.tl li.past .t{opacity:.55}
.nowtag{display:inline-block;background:var(--red);color:#fff;font-family:"Poppins";font-weight:600;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:1px}

/* ---------- facts ---------- */
.facts{display:grid;gap:9px}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.fact .ico{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;line-height:1}
.fact p{margin:0;font-size:14.5px}
.fact b{font-family:"Poppins";font-weight:600;display:block;font-size:14.5px;margin-bottom:1px}

/* ---------- finder ---------- */
.finder{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 10px;margin-top:26px;border-bottom:1px solid var(--border)}
.search{position:relative}
.search input{width:100%;padding:11px 40px 11px 13px;font-size:16px;font-family:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:11px;-webkit-appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:19px;padding:6px 10px;cursor:pointer;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:"Poppins";font-weight:500;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chips.areas .chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon)}
.count{font-size:12.5px;color:var(--muted);padding-top:8px;margin:0}

/* ---------- groups + cards ---------- */
.grp{margin-top:22px}
.grp-h{font-family:"Poppins";font-size:15px;font-weight:600;margin:0 0 3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.nearby-tag{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 7px}
.grp-s{font-size:12.5px;color:var(--muted);margin:0 0 11px}
.disclose{width:100%;appearance:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:"Poppins";font-weight:600;font-size:13.5px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.disclose .car{font-size:10px;transition:transform .18s}
.disclose[aria-expanded="true"] .car{transform:rotate(180deg)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.pill{font-family:"Poppins";font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.vc{color:var(--red);border-color:color-mix(in srgb,var(--red) 42%,transparent);background:color-mix(in srgb,var(--red) 9%,transparent)}
.pill.db{color:var(--maroon);border-color:color-mix(in srgb,var(--maroon) 42%,transparent);background:color-mix(in srgb,var(--maroon) 9%,transparent)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .pill.vc,
  :root:not([data-theme="light"]) .pill.db{color:#F0B7B3;border-color:#5C3330;background:#2C1D1B}
}
:root[data-theme="dark"] .pill.vc,:root[data-theme="dark"] .pill.db{color:#F0B7B3;border-color:#5C3330;background:#2C1D1B}
.zip{font-family:"Poppins";font-weight:600;font-size:10px;letter-spacing:.05em;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 8px}
.badge{font-family:"Poppins";font-weight:600;font-size:11px;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge.open{color:var(--open);background:var(--open-bg)}
.badge.closed{color:var(--shut);background:var(--shut-bg)}
.badge.soon{color:var(--soon);background:var(--soon-bg)}
.card h3{font-size:15.5px;font-weight:600;margin:0 0 3px;line-height:1.3}
.addr{font-size:14px;color:var(--muted);margin:0;-webkit-user-select:all;user-select:all;word-break:break-word}
.entry{font-size:12.5px;color:var(--muted);margin:4px 0 0;font-style:italic}
.hrs{font-size:13px;color:var(--muted);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--border)}
.acts{display:flex;gap:7px;margin-top:11px}
.btn{flex:1;appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:"Poppins";font-weight:600;font-size:13px;padding:10px 6px;border-radius:10px;text-align:center;text-decoration:none;cursor:pointer;line-height:1.3}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn:active{transform:translateY(1px)}
.empty{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px;margin-top:20px}

/* ---------- countywide ---------- */
.links{display:grid;gap:8px}
.lk{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-decoration:none;color:var(--text)}
.lk .ico{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;line-height:1}
.lk b{font-family:"Poppins";font-weight:600;font-size:14.5px;display:block}
.lk span{font-size:12.5px;color:var(--muted);display:block}
.lk .arw{margin-left:auto;color:var(--muted);font-size:15px;flex:0 0 auto}
.phones{display:flex;gap:8px;margin-top:9px}
.phones a{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 8px;text-align:center;text-decoration:none;color:var(--text)}
.phones b{display:block;font-family:"Poppins";font-weight:600;font-size:14.5px}
.phones span{display:block;font-size:11.5px;color:var(--muted)}

footer{margin-top:30px;padding:16px 0 46px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
footer p{margin:0 0 5px}
footer a{color:inherit}
</style>

<header class="masthead">
  <div class="wrap">
    <div class="mh-top">
      <div>
        <p class="kicker" id="kicker"></p>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="langtoggle" role="group" id="langgroup">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <div class="countdown" id="cd"></div>
    <p class="cd-note" id="cdnote"></p>
  </div>
</header>

<div class="wrap">

  <section>
    <h2 class="sec-h" data-i18n="h_dates"></h2>
    <ul class="tl" id="tl"></ul>
  </section>

  <section>

  </section>

  <h2 class="sec-h" style="margin-top:26px" data-i18n="h_find"></h2>
  <div class="finder">
    <div class="search">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clr" id="clr" type="button">&times;</button>

    <div class="chips types" role="group" id="typegroup">
      <button class="chip" type="button" data-type="all" aria-pressed="true" data-i18n="c_all"></button>
      <button class="chip" type="button" data-type="vc" aria-pressed="false" data-i18n="c_vc"></button>
      <button class="chip" type="button" data-type="db" aria-pressed="false" data-i18n="c_db"></button>
      <button class="chip" type="button" data-type="open" aria-pressed="false" data-i18n="c_open"></button>
    </div>
    <div class="chips areas" role="group" id="areagroup"></div>
    <p class="count" id="count"></p>
  </div>

  <div id="results"></div>

  <section>
    <h2 class="sec-h" data-i18n="h_county"></h2>
    <div class="links" id="links"></div>
    <div class="phones" id="phones"></div>
  </section>

  <footer>
    <p id="srcnote"></p>
    <p id="disclaimer"></p>
  </footer>
</div>

/* ============ Pacific time ============ */
var PF = new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"});
var WD = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function pacific(d){
  var parts = PF.formatToParts(d), p = {}, i;
  for(i=0;i<parts.length;i++) p[parts[i].type]=parts[i].value;
  var hh = (+p.hour)%24;
  return {dk:(+p.year)*10000+(+p.month)*100+(+p.day), min:hh*60+(+p.minute), wd:WD[p.weekday]};
}
function clock(min){
  var h=Math.floor(min/60), m=min%60, ap = h>=12?"PM":"AM", hr=h%12;
  if(hr===0) hr=12;
  return m===0 ? hr+" "+ap : hr+":"+(m<10?"0":"")+m+" "+ap;
}
function dkLabel(dk){
  var mo=Math.floor(dk/100)%100, d=dk%100, nm=t("months")[mo-1];
  return LANG==="es" ? (d+" de "+nm) : (nm+" "+d);
}

/* ============ status ============ */
var OPEN_DK_START = 20261004, ED_DK = 20261103;
function statusOf(L,P){
  if(L.t==="vc"){
    if(P.dk>ED_DK) return {k:"ended"};
    if(P.dk<L.opens) return {k:"soon",on:L.opens};
    var span = (P.dk===ED_DK) ? [hm(7),hm(20)] : [hm(8),hm(17)];
    if(P.min>=span[0] && P.min<span[1]) return {k:"open",until:span[1]};
    return {k:"closed",next:(P.min<span[0]?span[0]:null)};
  }
  if(P.dk<OPEN_DK_START) return {k:"soon",on:OPEN_DK_START};
  if(P.dk>ED_DK) return {k:"ended"};
  if(L.mode==="24"){
    if(P.dk===ED_DK) return P.min<hm(20) ? {k:"open",until:hm(20)} : {k:"closed"};
    return {k:"open"};
  }
  var s;
  if(P.dk===ED_DK) s=L.ed;
  else if(L.ov && L.ov[P.dk]) s=L.ov[P.dk];
  else if(L.closedOn && L.closedOn.indexOf(P.dk)>-1) s=null;
  else s=L.week[P.wd];
  if(!s) return {k:"closed"};
  if(P.min>=s[0] && P.min<s[1]) return {k:"open",until:s[1]};
  return {k:"closed",next:(P.min<s[0]?s[0]:null)};
}
function badgeFor(s){
  if(s.k==="open") return {cls:"open", txt:(s.until ? t("open")+" · "+t("closes")+" "+clock(s.until) : t("open"))};
  if(s.k==="soon") return {cls:"soon", txt:t("opensOn")+" "+dkLabel(s.on)};
  if(s.k==="ended") return {cls:"closed", txt:t("ended")};
  return {cls:"closed", txt:(s.next ? t("closed")+" · "+t("opens")+" "+clock(s.next) : t("closed"))};
}
var RANK = {open:0, soon:1, closed:2, ended:3};

/* ============ hours text ============ */
var DAY_ORDER = [1,2,3,4,5,6,0];
function sameSpan(a,b){ if(!a&&!b) return true; if(!a||!b) return false; return a[0]===b[0]&&a[1]===b[1]; }
function hoursText(L){
  if(L.t==="vc") return L.opens===20261024 ? t("vcH24") : t("vcH31");
  if(L.mode==="24") return t("hrs24");
  var names=t("dayNames"), runs=[], i, cur=null;
  for(i=0;i<DAY_ORDER.length;i++){
    var d=DAY_ORDER[i], sp=L.week[d]||null;
    if(cur && sameSpan(cur.sp,sp)) cur.days.push(d);
    else { cur={sp:sp,days:[d]}; runs.push(cur); }
  }
  var chunks = runs.map(function(r){
    var lbl;
    if(r.days.length===1) lbl=names[r.days[0]];
    else if(r.days.length===2) lbl=names[r.days[0]]+t("dayAnd")+names[r.days[1]];
    else lbl=names[r.days[0]]+t("dayTo")+names[r.days[r.days.length-1]];
    return r.sp ? (lbl+" "+clock(r.sp[0])+t("dayTo")+clock(r.sp[1])) : (lbl+" "+t("dayClosed"));
  });
  var out = chunks.join(t("sep"));
  if(L.ov){
    for(var k in L.ov){ if(L.ov.hasOwnProperty(k)){
      out += t("sep")+dkLabel(+k)+": "+clock(L.ov[k][0])+t("dayTo")+clock(L.ov[k][1]);
    }}
  }
  if(L.closedOn && L.closedOn.length){
    out += t("sep")+t("closedOnLine")+L.closedOn.map(dkLabel).join(", ");
  }
  if(L.ed) out += t("sep")+t("edLine")+clock(L.ed[0])+t("dayTo")+clock(L.ed[1]);
  return out;
}

/* ============ countdown ============ */
var ED_START_MS = Date.UTC(2026,10,3,8,0,0);
var ED_CLOSE_MS = Date.UTC(2026,10,4,4,0,0);
function renderCountdown(){
  var now=Date.now(), el=document.getElementById("cd"), nt=document.getElementById("cdnote");
  if(now>=ED_CLOSE_MS){ el.innerHTML=""; nt.textContent=t("cdover"); return; }
  var pre = now<ED_START_MS, target = pre?ED_START_MS:ED_CLOSE_MS;
  var s=Math.floor((target-now)/1000);
  var d=Math.floor(s/86400); s-=d*86400;
  var h=Math.floor(s/3600); s-=h*3600;
  var m=Math.floor(s/60); s-=m*60;
  var units = pre ? [[d,"days"],[h,"hours"],[m,"mins"]] : [[h,"hours"],[m,"mins"],[s,"secs"]];
  el.innerHTML = units.map(function(u){
    return '<div class="cd-unit"><span class="cd-num">'+u[0]+'</span><span class="cd-lab">'+t(u[1])+'</span></div>';
  }).join("");
  nt.textContent = pre ? t("cdnote") : t("cdclose");
}

var fType="all", fArea="all", fQ="";
var expanded = {};
AREAS.forEach(function(a){ expanded[a.id]=a.core; });

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function cardHTML(L,s){
  var b=badgeFor(s), full=L.a+", "+L.c+", CA "+L.z;
  return '<article class="card">'+
    '<div class="card-top">'+
      '<span class="pill '+L.t+'">'+(L.t==="vc"?t("vc"):t("db"))+'</span>'+
      '<span class="zip">'+L.z+'</span>'+
      '<span class="badge '+b.cls+'">'+b.txt+'</span>'+
    '</div>'+
    '<h3>'+esc(L.n)+'</h3>'+
    '<p class="addr">'+esc(full)+'</p>'+
    (L.entry ? '<p class="entry">'+t("entry")+esc(L.entry)+'</p>' : '')+
    '<p class="hrs">'+hoursText(L)+'</p>'+
    '<div class="acts">'+
      '<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&amp;destination='+encodeURIComponent(full)+'" target="_blank" rel="noopener">'+t("dir")+'</a>'+
      '<button class="btn" type="button" data-copy="'+esc(full)+'">'+t("copy")+'</button>'+
    '</div>'+
  '</article>';
}

function render(){
  var P=pacific(new Date());
  var filtering = (fQ!=="" || fType!=="all" || fArea!=="all");
  var rows=[], i;
  for(i=0;i<LOCS.length;i++){
    var L=LOCS[i], s=statusOf(L,P);
    if(fType==="vc" && L.t!=="vc") continue;
    if(fType==="db" && L.t!=="db") continue;
    if(fType==="open" && s.k!=="open") continue;
    if(fArea!=="all" && L.area!==fArea) continue;
    if(fQ){
      var hay=(L.n+" "+L.a+" "+L.c+" "+L.z).toLowerCase();
      if(hay.indexOf(fQ)===-1) continue;
    }
    rows.push({L:L,s:s});
  }
  rows.sort(function(x,y){
    var r=RANK[x.s.k]-RANK[y.s.k]; if(r) return r;
    if(x.L.t!==y.L.t) return x.L.t==="vc"?-1:1;
    return x.L.n.localeCompare(y.L.n);
  });

  document.getElementById("count").textContent =
    rows.length===1 ? t("foundOne") : t("foundMany").replace("{n}",rows.length);

  var out=document.getElementById("results");
  if(!rows.length){ out.innerHTML='<p class="empty">'+t("none")+'</p>'; return; }

  var html="";
  AREAS.forEach(function(A){
    var list = rows.filter(function(r){ return r.L.area===A.id; });
    if(!list.length) return;
    var isOpen = filtering ? true : expanded[A.id];
    html += '<div class="grp">'+
      '<h3 class="grp-h">'+A.name+(A.core?"":'<span class="nearby-tag">'+t("nearby")+'</span>')+'</h3>'+
      '<p class="grp-s">'+A.zips+'</p>';
    if(!A.core && !filtering){
      html += '<button class="disclose" type="button" data-grp="'+A.id+'" aria-expanded="'+(isOpen?"true":"false")+'">'+
        (isOpen ? t("hideGroup").replace("{a}",A.name)
                : t("showGroup").replace("{n}",list.length).replace("{a}",A.name))+
        '<span class="car" aria-hidden="true">▼</span></button>';
    }
    if(isOpen){
      html += '<div style="margin-top:'+((!A.core&&!filtering)?"10px":"0")+'">'+
        list.map(function(r){ return cardHTML(r.L,r.s); }).join("")+'</div>';
    }
    html += '</div>';
  });
  out.innerHTML = html;
}

/* ============ static chrome ============ */
function renderChrome(){
  document.getElementById("kicker").textContent = t("kicker");
  document.getElementById("title").textContent = t("title");
  document.getElementById("subtitle").textContent = t("sub");
  var els=document.querySelectorAll("[data-i18n]"), i;
  for(i=0;i<els.length;i++) els[i].textContent = t(els[i].getAttribute("data-i18n"));
  var q=document.getElementById("q");
  q.placeholder = t("search"); q.setAttribute("aria-label", t("search"));
  document.getElementById("clr").setAttribute("aria-label", t("clear"));
  document.getElementById("langgroup").setAttribute("aria-label", t("langlabel"));
  document.getElementById("typegroup").setAttribute("aria-label", t("typelabel"));
  document.getElementById("areagroup").setAttribute("aria-label", t("arealabel"));
  document.getElementById("srcnote").textContent = t("src");
  document.getElementById("disclaimer").textContent = t("disc");

  document.getElementById("areagroup").innerHTML =
    '<button class="chip" type="button" data-area="all" aria-pressed="'+(fArea==="all")+'">'+t("a_all")+'</button>'+
    AREAS.map(function(A){
      return '<button class="chip" type="button" data-area="'+A.id+'" aria-pressed="'+(fArea===A.id)+'">'+A.name+'</button>';
    }).join("");

  document.getElementById("links").innerHTML = t("links").map(function(L){
    return '<a class="lk" href="'+L[3]+'" target="_blank" rel="noopener">'+
      '<span class="ico" aria-hidden="true">'+L[0]+'</span>'+
      '<span><b>'+L[1]+'</b><span>'+L[2]+'</span></span>'+
      '<span class="arw" aria-hidden="true">›</span></a>';
  }).join("");

  document.getElementById("phones").innerHTML =
    '<a href="tel:+18585655800"><b>(858) 565-5800</b><span>'+t("phoneMain")+'</span></a>'+
    '<a href="tel:+18006960136"><b>(800) 696-0136</b><span>'+t("phoneFree")+'</span></a>';

  var lb=document.querySelectorAll("#langgroup button");
  for(i=0;i<lb.length;i++) lb[i].setAttribute("aria-pressed", String(lb[i].getAttribute("data-lang")===LANG));
}

function applyLang(){
  document.documentElement.lang = LANG;
  try{ localStorage.setItem("cd48-lang", LANG); }catch(e){}
  renderChrome(); renderTimeline(); renderCountdown(); render();
}

/* ============ events ============ */
document.addEventListener("click", function(e){
  var lang=e.target.closest ? e.target.closest("#langgroup button") : null;
  if(lang){ LANG=lang.getAttribute("data-lang"); applyLang(); return; }

  var ty=e.target.closest ? e.target.closest("#typegroup .chip") : null;
  if(ty){
    fType=ty.getAttribute("data-type");
    var tb=document.querySelectorAll("#typegroup .chip"), i;
    for(i=0;i<tb.length;i++) tb[i].setAttribute("aria-pressed", String(tb[i]===ty));
    render(); return;
  }

  var ar=e.target.closest ? e.target.closest("#areagroup .chip") : null;
  if(ar){
    fArea=ar.getAttribute("data-area");
    var ab=document.querySelectorAll("#areagroup .chip"), j;
    for(j=0;j<ab.length;j++) ab[j].setAttribute("aria-pressed", String(ab[j]===ar));
    render(); return;
  }

  var dg=e.target.closest ? e.target.closest("[data-grp]") : null;
  if(dg){ var id=dg.getAttribute("data-grp"); expanded[id]=!expanded[id]; render(); return; }

  var cp=e.target.closest ? e.target.closest("[data-copy]") : null;
  if(cp){
    var txt=cp.getAttribute("data-copy"), old=cp.textContent;
    var done=function(){ cp.textContent=t("copied"); setTimeout(function(){ cp.textContent=old; },1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,done); }
    else {
      var ta=document.createElement("textarea"); ta.value=txt;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(err){}
      ta.parentNode.removeChild(ta); done();
    }
    return;
  }
});
document.getElementById("q").addEventListener("input", function(e){
  fQ = e.target.value.trim().toLowerCase(); render();
});
document.getElementById("clr").addEventListener("click", function(){
  var q=document.getElementById("q"); q.value=""; fQ=""; render(); q.focus();
});

/* ============ boot ============ */
try{ var saved=localStorage.getItem("cd48-lang"); if(saved==="es"||saved==="en") LANG=saved; }catch(e){}
applyLang();
setInterval(renderCountdown, 1000);
setInterval(function(){ renderTimeline(); render(); }, 60000);
})();
</script>
